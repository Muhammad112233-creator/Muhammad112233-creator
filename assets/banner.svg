<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#120a2e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"><animate attributeName="stop-color" values="#00F5FF;#7B2FFF;#FF00C8;#00F5FF" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#FF00C8"><animate attributeName="stop-color" values="#FF00C8;#00F5FF;#7B2FFF;#FF00C8" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7B2FFF" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- scanning beam -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="300" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- floating particles -->
  <g fill="#00F5FF">
    <circle cx="80" cy="250" r="3"><animate attributeName="cy" values="260;20;260" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="40" r="2"><animate attributeName="cy" values="30;270;30" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="260" r="2.5" fill="#FF00C8"><animate attributeName="cy" values="270;30;270" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="3" fill="#7B2FFF"><animate attributeName="cy" values="40;260;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="240" r="2" fill="#FF00C8"><animate attributeName="cy" values="250;20;250" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="60" r="3"><animate attributeName="cy" values="50;270;50" dur="7.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- title -->
  <text x="500" y="150" text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="10" fill="url(#txt)" filter="url(#glow)">MUHAMMAD</text>
  <!-- cycling subtitles -->
  <g font-family="'Courier New', monospace" font-size="22" text-anchor="middle" fill="#00F5FF">
    <text x="500" y="212" opacity="0">&gt; Solo Developer | Pakistan
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.05;0.28;0.33;0.4;0.6;0.7;0.9;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="500" y="212" opacity="0">&gt; Building browser-native worlds
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.3;0.35;0.4;0.62;0.67;0.7;0.9;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="500" y="212" opacity="0">&gt; Zero budget. Infinite imagination.
      <animate attributeName="opacity" values="0;0;0;0;0;1;1;0;0" keyTimes="0;0.3;0.5;0.6;0.65;0.7;0.95;1;1" dur="9s" repeatCount="indefinite"/></text>
  </g>
  <!-- border -->
  <rect x="2" y="2" width="996" height="296" rx="17" fill="none" stroke="url(#txt)" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
