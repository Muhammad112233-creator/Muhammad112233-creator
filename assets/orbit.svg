<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF00C8"/><stop offset="1" stop-color="#7B2FFF"/>
    </radialGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="700" height="440" rx="18" fill="#0d1117"/>
  <g transform="translate(350,220)" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <!-- rings -->
    <circle r="90" fill="none" stroke="#00F5FF" stroke-opacity="0.35" stroke-dasharray="4 8"/>
    <circle r="160" fill="none" stroke="#7B2FFF" stroke-opacity="0.35" stroke-dasharray="4 8"/>
    <!-- core -->
    <circle r="46" fill="url(#core)" filter="url(#gl)"><animate attributeName="r" values="44;52;44" dur="3s" repeatCount="indefinite"/></circle>
    <text y="7" font-size="20" fill="#fff">CODE</text>
    <!-- inner orbit -->
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(90,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/><circle r="26" fill="#E34F26" filter="url(#gl)"/><text y="5" font-size="13" fill="#fff">HTML</text></g></g>
      <g transform="translate(-90,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite"/><circle r="26" fill="#1572B6" filter="url(#gl)"/><text y="5" font-size="13" fill="#fff">CSS</text></g></g>
    </g>
    <!-- outer orbit -->
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
      <g transform="translate(160,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/><circle r="28" fill="#F7DF1E" filter="url(#gl)"/><text y="5" font-size="15" fill="#000">JS</text></g></g>
      <g transform="translate(0,160)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/><circle r="28" fill="#F05032" filter="url(#gl)"/><text y="5" font-size="14" fill="#fff">Git</text></g></g>
      <g transform="translate(-160,0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/><circle r="28" fill="#990000" filter="url(#gl)"/><text y="5" font-size="12" fill="#fff">WebGL</text></g></g>
      <g transform="translate(0,-160)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/><circle r="28" fill="#2b3137" stroke="#00F5FF" filter="url(#gl)"/><text y="5" font-size="12" fill="#fff">GitHub</text></g></g>
    </g>
  </g>
</svg>
