<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#7B2FFF"/>
      <stop offset="0.75" stop-color="#FF00C8"/>
      <stop offset="1" stop-color="#FF00C8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#d)" filter="url(#g)"/>
  <circle r="5" cy="12" fill="#ffffff" filter="url(#g)">
    <animate attributeName="cx" values="0;1000;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00F5FF;#7B2FFF;#FF00C8;#7B2FFF;#00F5FF" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="12" r="3" fill="#7B2FFF"><animate attributeName="r" values="3;8;3" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
